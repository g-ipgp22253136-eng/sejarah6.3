                opts: ["马来亚、新加坡、砂拉越、沙巴", "马来亚、文莱、砂拉越、沙巴", "马来亚、新加坡、泰国、文莱", "马来亚、砂拉越、沙巴、印尼"],
                ans: 0,
                exp: "最初成员为：马来亚、新加坡、砂拉越及沙巴。"
            },
            {
                q: "16. 关于文莱（Brunei）在成立马来西亚过程中的情况，以下哪项是正确的？",
                opts: ["从一开始就坚决反对", "曾参与讨论但最终没有加入", "1963年成功加入", "被强行排除"],
                ans: 1,
                exp: "文莱原本曾参与讨论，但最终选择不加入。"
            },
            {
                q: "17. 负责调查沙砂民意的‘葛波委员会’是以谁的名字命名的？",
                opts: ["主席勋爵葛波 (Lord Cobbold)", "英国女王", "联合国秘书长", "沙巴首长"],
                ans: 0,
                exp: "葛波委员会由主席勋爵葛波 (Lord Cobbold) 领衔并命名。"
            },
            {
                q: "18. 在 3.1 至 3.6 的历程中，最先成立的机构/事件是？",
                opts: ["葛波委员会 (1962)", "新加坡全民投票 (1962)", "马来西亚团结协商委员会 JPPM (1961)", "联合国调查团 (1963)"],
                ans: 2,
                exp: "JPPM 最早于 1961 年成立。"
            },
            {
                q: "19. 哪一个委员会主要负责讨论宗教、教育、语言和沙砂特殊权益等宪法安排？",
                opts: ["JPPM 委员会", "政府间委员会 (JAK/IGC)", "葛波委员会", "联合国调查团"],
                ans: 1,
                exp: "JAK (Government Inter-Committee) 负责宪法与各方面权益的制定。"
            },
            {
                q: "20. 总结：成立马来西亚经历了一系列讨论、谈判与调查，这体现了什么精神？",
                opts: ["独裁专制", "民主、协商与尊重民意", "武力征服", "草率决定"],
                ans: 1,
                exp: "马来西亚的成立充分体现了民主协商与尊重各地区人民意愿的精神！"
            }
        ];

        // APP STATE
        let currentSlideIndex = 0;
        let currentQuizIndex = 0;
        let quizAnswers = new Array(quizData.length).fill(null);
        let score = 0;

        // INIT
        window.onload = function() {
            renderSlide(currentSlideIndex);
            renderQuizCard(currentQuizIndex);
        };

        // NAVIGATION MODE SWITCH
        function switchMode(mode) {
            const notesSec = document.getElementById('mode-notes');
            const quizSec = document.getElementById('mode-quiz');
            const btnNotes = document.getElementById('btn-nav-notes');
            const btnQuiz = document.getElementById('btn-nav-quiz');

            if (mode === 'notes') {
                notesSec.classList.remove('hidden');
                quizSec.classList.add('hidden');
                btnNotes.className = "px-4 py-2 rounded-xl font-bold text-xs md:text-sm transition-all bg-white text-blue-900 shadow-md";
                btnQuiz.className = "px-4 py-2 rounded-xl font-bold text-xs md:text-sm transition-all text-white hover:bg-white/10";
            } else {
                notesSec.classList.add('hidden');
                quizSec.classList.remove('hidden');
                btnQuiz.className = "px-4 py-2 rounded-xl font-bold text-xs md:text-sm transition-all bg-white text-blue-900 shadow-md";
                btnNotes.className = "px-4 py-2 rounded-xl font-bold text-xs md:text-sm transition-all text-white hover:bg-white/10";
            }
        }

        // ================= SLIDE NOTES RENDERER =================
        function goToSlide(idx) {
            currentSlideIndex = idx;
            renderSlide(currentSlideIndex);
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide(currentSlideIndex);
            }
        }

        function nextSlide() {
            if (currentSlideIndex < notesData.length - 1) {
                currentSlideIndex++;
                renderSlide(currentSlideIndex);
            }
        }

        function renderSlide(idx) {
            const data = notesData[idx];
            const stage = document.getElementById('slide-stage');
            
            // Update Top Selector Ribbon
            const navBtns = document.querySelectorAll('.slide-nav-btn');
            navBtns.forEach((btn, i) => {
                if (i === idx) {
                    btn.className = "slide-nav-btn flex-1 min-w-[100px] text-center p-2 rounded-xl border-2 border-blue-500 bg-blue-50 font-bold text-xs text-blue-900 shadow-sm transition-all";
                } else {
                    btn.className = "slide-nav-btn flex-1 min-w-[100px] text-center p-2 rounded-xl border-2 border-slate-200 bg-white font-bold text-xs text-slate-600 hover:bg-slate-50 transition-all";
                }
            });

            // Slide Counter Text
            document.getElementById('slide-counter-text').innerText = `第 ${idx + 1} / ${notesData.length} 话`;
            document.getElementById('btn-prev-slide').disabled = (idx === 0);
            document.getElementById('btn-prev-slide').style.opacity = (idx === 0) ? '0.5' : '1';

            // HTML Structure for Slide
            stage.innerHTML = `
                <div class="animate-fade-in space-y-4">
                    <!-- Header Badges -->
                    <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-200 pb-3">
                        <div class="flex items-center gap-2">
                            <span class="${data.badgeColor} text-white font-black text-xs px-3 py-1 rounded-lg shadow-sm">
                                章节 ${data.section}
                            </span>
                            <span class="bg-slate-800 text-amber-300 font-bold text-xs px-3 py-1 rounded-lg">
                                年份：${data.year}
                            </span>
                        </div>
                        <div class="text-3xl">${data.icon}</div>
                    </div>

                    <!-- Titles -->
                    <div>
                        <h3 class="text-2xl font-black text-slate-800 leading-tight">${data.title}</h3>
                        <p class="text-sm font-bold text-blue-600">${data.titleBM}</p>
                    </div>

                    <!-- Chairman Info -->
                    <div class="bg-blue-50 border border-blue-200 p-3 rounded-2xl flex items-center gap-3 text-xs md:text-sm">
                        <span class="text-xl">👤</span>
                        <div>
                            <span class="font-bold text-slate-500 block">负责人 / 主席：</span>
                            <span class="font-black text-blue-900">${data.chairman}</span>
                        </div>
                    </div>

                    <!-- Purposes -->
                    <div class="space-y-2">
                        <span class="font-bold text-xs uppercase tracking-wider text-slate-400 block">🎯 主要目的 / 职责：</span>
                        <ul class="space-y-1.5 text-xs md:text-sm text-slate-700">
                            ${data.purposes.map(p => `
                                <li class="flex items-start gap-2 bg-white/80 p-2 rounded-xl border border-slate-100">
                                    <span class="text-blue-500 font-bold">•</span>
                                    <span>${p}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <!-- Results if any -->
                    ${data.results ? `
                        <div class="space-y-2 pt-1">
                            <span class="font-bold text-xs uppercase tracking-wider text-slate-400 block">📊 调查结果 / 成员：</span>
                            <div class="space-y-1 text-xs md:text-sm text-slate-800">
                                ${data.results.map(r => `
                                    <div class="p-2 rounded-xl bg-amber-50 border border-amber-200 font-bold">
                                        ${r}
                                    </div>
                                me`).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- Teacher Tip -->
                    <div class="bg-slate-900 text-amber-300 p-3 rounded-2xl text-xs leading-relaxed border-l-4 border-amber-400">
                        ${data.extraNote}
                    </div>
                </div>
            `;
        }

        // ================= 20-QUESTION QUIZ ENGINE =================
        function renderQuizCard(idx) {
            const q = quizData[idx];
            const container = document.getElementById('quiz-card');
            const userAns = quizAnswers[idx];

            document.getElementById('quiz-progress-text').innerText = idx + 1;
            document.getElementById('quiz-score-text').innerText = score;

            document.getElementById('btn-prev-quiz').disabled = (idx === 0);
            document.getElementById('btn-prev-quiz').style.opacity = (idx === 0) ? '0.5' : '1';

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center text-xs text-slate-400 font-bold">
                        <span>QUESTION ${idx + 1} OF 20</span>
                        <span class="bg-blue-100 text-blue-700 px-2.5 py-1 rounded-md">3.1 - 3.6 综合考点</span>
                    </div>

                    <h3 class="text-lg md:text-xl font-black text-slate-800 leading-snug">
                        ${q.q}
                    </h3>

                    <div class="space-y-2.5 pt-2">
                        ${q.opts.map((opt, oIdx) => {
                            let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-blue-400";
                            
                            if (userAns !== null) {
                                if (oIdx === q.ans) {
                                    btnStyle = "bg-emerald-50 border-2 border-emerald-500 text-emerald-900 font-bold";
                                } else if (oIdx === userAns) {
                                    btnStyle = "bg-red-50 border-2 border-red-400 text-red-900 font-bold";
                                }
                            }

                            return `
                                <button onclick="selectQuizAnswer(${idx}, ${oIdx})" ${userAns !== null ? 'disabled' : ''} class="w-full text-left p-3.5 rounded-2xl ${btnStyle} transition-all text-xs md:text-sm flex items-center justify-between">
                                    <span>${opt}</span>
                                    ${userAns !== null && oIdx === q.ans ? '<i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>' : ''}
                                    ${userAns !== null && oIdx === userAns && userAns !== q.ans ? '<i class="fa-solid fa-circle-xmark text-red-500 text-lg"></i>' : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>

                    ${userAns !== null ? `
                        <div class="p-3 rounded-2xl bg-blue-50 border border-blue-200 text-xs text-blue-900 space-y-1 animate-fade-in">
                            <span class="font-bold block">💡 考点解析：</span>
                            <p>${q.exp}</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function selectQuizAnswer(qIdx, optIdx) {
            if (quizAnswers[qIdx] !== null) return;
            quizAnswers[qIdx] = optIdx;

            if (optIdx === quizData[qIdx].ans) {
                score += 5; // 20 questions * 5 = 100 max
            }

            renderQuizCard(qIdx);

            // Auto advance or show summary
            if (qIdx === quizData.length - 1) {
                setTimeout(showCertificateModal, 1200);
            }
        }

        function prevQuiz() {
            if (currentQuizIndex > 0) {
                currentQuizIndex--;
                renderQuizCard(currentQuizIndex);
            }
        }

        function nextQuiz() {
            if (currentQuizIndex < quizData.length - 1) {
                currentQuizIndex++;
                renderQuizCard(currentQuizIndex);
            } else {
                showCertificateModal();
            }
        }

        function showCertificateModal() {
            const correctCount = quizAnswers.filter((a, idx) => a === quizData[idx].ans).length;
            document.getElementById('cert-correct').innerText = `${correctCount} / ${quizData.length}`;
            document.getElementById('cert-score').innerText = score;

            let evalMsg = "";
            if (score === 100) evalMsg = "🌟 完美满分！你已经全面掌握了马来西亚成立的所有关键事件！历史小霸王！";
            else if (score >= 80) evalMsg = "🎉 表现优秀！对大部分委员会与历史节点记忆深刻！";
            else if (score >= 60) evalMsg = "👍 及格通过！建议再次温习“葛波委员会”与“JAK委员会”的区别哦！";
            else evalMsg = "💪 再接再厉！可以随时切换到【动画笔记】模式重新巩固基础！";

            document.getElementById('cert-eval').innerText = evalMsg;
            document.getElementById('modal-certificate').classList.remove('hidden');

            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }

        function closeModal() {
            document.getElementById('modal-certificate').classList.add('hidden');
        }

        function restartQuiz() {
            quizAnswers = new Array(quizData.length).fill(null);
            score = 0;
            currentQuizIndex = 0;
            closeModal();
            renderQuizCard(currentQuizIndex);
        }
    </script>
</body>
</html>
